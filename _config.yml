title: SmartMoneyDaily
description: "Plain-English guides to high-yield savings accounts, CDs, and money market accounts."
url: "https://smartmoneydaily.github.io"
baseurl: ""
permalink: /:year/:month/:day/:title/
paginate: 12
paginate_path: "/page/:num/"
# 미래 날짜 글은 그날이 오기 전까지 사이트에 내보내지 않는다 (2026-08-19).
# 며칠치를 미리 써 두고 하루 한 편씩 공개하기 위한 설정 — deploy.yml 의 일일 cron 이 짝.
future: false

theme: minima

author:
  name: Kkuma Park
  email: "200kgBrothers@gmail.com"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true

google_analytics: "G-5L40K3SBQT"

exclude:
  - scripts/
  - .github/
  - README.md
  - Gemfile
  - Gemfile.lock

include:
  - ads.txt
  - robots.txt
  - 3edb9ac60100921ec4665d794fb30755.txt
